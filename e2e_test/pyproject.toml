[project]
name = "prm393-artemis-e2e"
version = "0.1.0"
description = "PRM393 Android end-to-end tests driven by Google ARTEMIS"
requires-python = ">=3.12"
dependencies = [
    "artemis-client @ git+https://github.com/google/artemis.git@351ca8422f7b5b54e80a9c1ce03a222e02415b6b#subdirectory=packages/artemis-client",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-repeat>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
addopts = "-ra"
