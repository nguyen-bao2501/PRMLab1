spring.application.name=SBA301_2026Summer_PE01
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PRM;encrypt=false;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
# Keep existing SQL Server data when restarting the backend.
spring.jpa.hibernate.ddl-auto=update
spring.data.jpa.repositories.enabled=true
server.port=8080


# Jackson – serialize LocalDate as yyyy-MM-dd
spring.jackson.date-format=yyyy-MM-dd

# SpringDoc / Swagger UI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Google and JWT. GOOGLE_DESKTOP_CLIENT_ID or GOOGLE_CLIENT_ID can override this
# Desktop OAuth client ID when deploying to another Google Cloud project.
app.google.client-id=${GOOGLE_DESKTOP_CLIENT_ID:${GOOGLE_CLIENT_ID:1069522180614-25qed6d6ek5bn9ejogd6roigbh3pal2t.apps.googleusercontent.com}}
app.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:${app.google.client-id}}
app.attendance.public-base-url=${ATTENDANCE_PUBLIC_BASE_URL:http://localhost:8080}
app.google.service-account-path=${GOOGLE_SERVICE_ACCOUNT_PATH:classpath:google-service-account.json}
app.jwt.secret=${JWT_SECRET:yourSecretKeyHereMustBeAtLeast32CharactersLongForHS256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# A QR attendance session stays open for ten minutes unless the teacher closes it.
app.attendance.qr-duration-seconds=600
app.attendance.expiration-check-ms=15000
logging.level.org.springframework.core.env=DEBUG
spring.profiles.active=dev
