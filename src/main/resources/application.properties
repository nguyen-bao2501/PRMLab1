spring.application.name=SBA301_2026Summer_PE01
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PRM;encrypt=false;
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.data.jpa.repositories.enabled=true
server.port=8080


# Jackson – serialize LocalDate as yyyy-MM-dd
spring.jackson.date-format=yyyy-MM-dd

# SpringDoc / Swagger UI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Google and JWT. GOOGLE_CLIENT_ID can override this Web OAuth client ID when
# deploying to another Google Cloud project.
app.google.client-id=${GOOGLE_CLIENT_ID:1069522180614-vmbaf8brmb5ihlkkgg1nv5mvuvd7s8pn.apps.googleusercontent.com}
app.google.service-account-path=${GOOGLE_SERVICE_ACCOUNT_PATH:classpath:google-service-account.json}
app.jwt.secret=${JWT_SECRET:yourSecretKeyHereMustBeAtLeast32CharactersLongForHS256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# A QR attendance session stays open for ten minutes unless the teacher closes it.
app.attendance.qr-duration-seconds=600
app.attendance.expiration-check-ms=15000
logging.level.org.springframework.core.env=DEBUG
spring.profiles.active=dev

